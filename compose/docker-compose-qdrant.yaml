services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
      - "6378:6378"
    volumes:
      - redis_storage:/data
    restart: unless-stopped
volumes:
  qdrant_storage:
  redis_storage: